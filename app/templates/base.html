<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ScoutNexus{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/candidates">ScoutNexus</a>
  <nav>
    <a href="/candidates">Inbox</a>
    <a href="/campaigns">Campaigns</a>
    <a href="/discovery">Discovery</a>
    <a href="/sources">Sources</a>
  </nav>
</header>
{% if demo_mode %}
<div class="demo-banner">Demo data — no real platform connection. Nothing here is a real post.</div>
{% endif %}
<div class="platform-status">Reddit: {{ reddit_status }}</div>
<main class="container">
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
